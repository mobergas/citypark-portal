<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Account Portal · City Park Management</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blk:#0d0d0d;--lime:#b5d96e;--lime-dark:#7a9e3b;--gold:#f0c040;--red:#d32f2f;--fc:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;}
body{font-family:var(--fb);background:#f5f5f5;color:var(--blk);min-height:100vh;}
.hd{background:var(--blk);padding:16px 24px;border-bottom:5px solid var(--lime)}
.logo{font-family:var(--fc);font-weight:900;font-size:22px;color:#fff;text-decoration:none;display:block}
.logo span{color:var(--lime);font-size:11px;display:block;letter-spacing:.12em;text-transform:uppercase}
.wrap{max-width:560px;margin:32px auto;padding:0 16px 60px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.10);margin-bottom:20px}
.card-hd{background:var(--blk);padding:20px 24px;border-bottom:4px solid var(--lime)}
.card-hd h1{font-family:var(--fc);font-size:26px;font-weight:900;color:#fff;text-transform:uppercase}
.card-hd p{color:#aaa;font-size:13px;margin-top:4px}
.card-bd{padding:24px}
.cap-display{background:var(--blk);border-radius:10px;padding:18px;text-align:center;margin-bottom:16px}
.cap-display .capn{font-family:var(--fc);font-size:36px;font-weight:900;color:var(--lime)}
.cap-display .capl{font-family:var(--fc);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-top:4px}
.cap-bar{height:8px;background:#222;border-radius:4px;margin-top:12px;overflow:hidden}
.cap-bar-f{height:100%;background:var(--lime)}
.fl{font-family:var(--fc);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#666;margin-bottom:6px;display:block}
.fg{margin-bottom:16px}
.fi{width:100%;background:#f8f8f8;border:1.5px solid #e0e0e0;border-radius:8px;padding:11px 13px;font-family:var(--fb);font-size:15px;color:var(--blk);outline:none}
.fi:focus{border-color:var(--lime-dark);background:#fff}
.fse{width:100%;background:#f8f8f8;border:1.5px solid #e0e0e0;border-radius:8px;padding:11px 13px;font-family:var(--fb);font-size:15px;color:var(--blk);outline:none;cursor:pointer}
.btn{width:100%;background:var(--lime);color:var(--blk);border:none;border-radius:10px;padding:14px;font-family:var(--fc);font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:12px;margin-top:8px;text-align:center;min-height:16px}
.success-msg{background:#e8f5e9;border:1.5px solid #a5d6a7;color:#2e7d32;border-radius:8px;padding:12px 14px;font-size:13px;margin-top:12px;display:none}
.success-msg.show{display:block}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}
.history-row:last-child{border-bottom:none}
.badge{display:inline-block;font-family:var(--fc);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.badge.active{background:#e8f5e9;color:#2e7d32}
.badge.pending{background:#fff3cd;color:#a17b00}
.badge.canceled{background:#f5f5f5;color:#888}
.loading{text-align:center;padding:60px;color:#888}
.error-page{text-align:center;padding:40px}
.error-page h2{font-family:var(--fc);font-size:28px;color:var(--red);margin-bottom:8px}
</style>
</head>
<body>
<div class="hd"><a class="logo" href="/">city park<span>management</span></a></div>
<div class="wrap" id="main">
  <div class="loading"><p>Loading your portal...</p></div>
</div>

<script>
const SUPA_URL='https://sldahhdbvcxdlqdhmsjd.supabase.co';
const SUPA_KEY='sb_publishable_ZGELlV5vw7QFvva8_8NGcA_pQplXd46';
let acctData=null;
let lotsData=[];
let passesData=[];

async function db(table,method,body,query=''){
  const res=await fetch(`${SUPA_URL}/rest/v1/${table}${query}`,{
    method,
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'},
    body:body?JSON.stringify(body):undefined
  });
  if(!res.ok)return null;
  return res.json();
}

async function init(){
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  if(!token){showError('Invalid portal link.');return;}
  const accts=await db('master_accounts','GET',null,`?business_token=eq.${token}&select=*`);
  if(!accts||!accts.length){showError('Portal not found. Please contact City Park Management.');return;}
  acctData=accts[0];
  if(!acctData.active){showError('This account is currently inactive. Please contact City Park Management.');return;}

  const allLots=await db('lots','GET',null,'?select=*');
  lotsData=(allLots||[]).filter(l=>(acctData.lot_ids||[]).includes(l.id));

  passesData=await db('passes','GET',null,`?master_account_id=eq.${acctData.id}&order=created_at.desc&select=*`)||[];

  render();
}

function render(){
  const a=acctData;
  const used=passesData.filter(p=>p.status!=='canceled').length;
  const pct=a.pass_cap>0?Math.min(100,Math.round(used/a.pass_cap*100)):0;
  const atCap=used>=a.pass_cap;
  const lotOpts=lotsData.map(l=>`<option value="${l.id}">${l.name} · Zone ${l.zone}</option>`).join('');

  document.getElementById('main').innerHTML=`
    <div class="card">
      <div class="card-hd">
        <h1>${a.business_name}</h1>
        <p>Free Parking Pass Invites</p>
      </div>
      <div class="card-bd">
        <div class="cap-display">
          <div class="capn">${used} / ${a.pass_cap}</div>
          <div class="capl">Passes Used</div>
          <div class="cap-bar"><div class="cap-bar-f" style="width:${pct}%;background:${atCap?'var(--red)':'var(--lime)'}"></div></div>
        </div>
        ${atCap?`<p style="font-size:13px;color:var(--red);text-align:center;margin-bottom:12px">You've reached your pass limit. Contact City Park Management to increase it.</p>`:`
        <div class="fg"><label class="fl">Full Name</label><input class="fi" id="inv-name" placeholder="e.g. John Smith"></div>
        <div class="fg"><label class="fl">Email Address</label><input class="fi" id="inv-email" type="email" placeholder="e.g. john@example.com"></div>
        ${lotsData.length>1?`<div class="fg"><label class="fl">Lot</label><select class="fse" id="inv-lot">${lotOpts}</select></div>`:`<input type="hidden" id="inv-lot-single" value="${lotsData[0]?.id||''}">`}
        <button class="btn" id="inv-btn" onclick="sendInvite()"><i class="ti ti-send"></i>Send Invite</button>
        <div class="err" id="inv-err"></div>
        <div class="success-msg" id="inv-success">Invite sent! They'll receive an email to activate their free pass.</div>
        `}
      </div>
    </div>

    ${passesData.length>0?`<div class="card">
      <div class="card-hd"><h1>Sent Invites</h1><p>${passesData.length} total</p></div>
      <div class="card-bd">
        <div class="fg"><input class="fi" id="pass-search" placeholder="Search by name or email..." oninput="renderPassList()"></div>
        <div id="pass-list"></div>
      </div>
    </div>`:''}

    <p style="font-size:12px;color:#aaa;text-align:center;margin-top:20px">Questions? Contact us at info@cityparkmanagement.com</p>
  `;
  renderPassList();
}

async function sendInvite(){
  const name=document.getElementById('inv-name')?.value.trim();
  const email=document.getElementById('inv-email')?.value.trim();
  const lotId=lotsData.length>1?document.getElementById('inv-lot')?.value:document.getElementById('inv-lot-single')?.value;
  const errEl=document.getElementById('inv-err');
  const successEl=document.getElementById('inv-success');
  errEl.textContent='';successEl.classList.remove('show');

  if(!name){errEl.textContent='Name is required.';return;}
  if(!email||!email.includes('@')){errEl.textContent='Valid email is required.';return;}
  if(!lotId){errEl.textContent='Please select a lot.';return;}

  const btn=document.getElementById('inv-btn');
  btn.textContent='Sending...';btn.disabled=true;

  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');

  const res=await fetch(`${SUPA_URL}/functions/v1/send-master-invite`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPA_KEY},
    body:JSON.stringify({businessToken:token,name,email,lotId})
  });
  const data=await res.json();

  btn.textContent='Send Invite';btn.disabled=false;

  if(data.error){errEl.textContent=data.error;return;}

  successEl.classList.add('show');
  document.getElementById('inv-name').value='';
  document.getElementById('inv-email').value='';

  passesData=await db('passes','GET',null,`?master_account_id=eq.${acctData.id}&order=created_at.desc&select=*`)||[];
  setTimeout(()=>render(),1200);
}

async function cancelInvite(passId,name){
  if(!confirm(`Cancel the pass for ${name}? This can't be undone from here — contact City Park Management to reinstate.`))return;
  await db('passes','PATCH',{status:'canceled',next_bill_date:null},`?id=eq.${passId}`);
  passesData=await db('passes','GET',null,`?master_account_id=eq.${acctData.id}&order=created_at.desc&select=*`)||[];
  render();
}

function showError(msg){
  document.getElementById('main').innerHTML=`<div class="error-page"><h2>⚠️ Oops!</h2><p style="color:#666">${msg}</p></div>`;
}

init();
</script>
</body>
</html>
