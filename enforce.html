<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon_io/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/enforce-apple-touch-icon.png">
<link rel="manifest" href="favicon_io/enforce.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CP Enforcement">
<title>Enforcement · City Park Management</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--blk:#0d0d0d;--lime:#b5d96e;--lime-dark:#7a9e3b;--red:#d32f2f;--gold:#f0c040;--fc:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;}
body{font-family:var(--fb);background:#0d0d0d;color:#fff;min-height:100vh;}
.hd{background:#111;padding:14px 16px;border-bottom:3px solid var(--lime);display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--fc);font-weight:900;font-size:20px;color:#fff}
.logo span{color:var(--lime);font-size:10px;display:block;letter-spacing:.12em;text-transform:uppercase}
.badge{background:var(--lime);color:var(--blk);font-family:var(--fc);font-size:11px;font-weight:900;padding:3px 10px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase}
.wrap{padding:16px;max-width:500px;margin:0 auto}
.card{background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #2a2a2a}
.card-title{font-family:var(--fc);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#888;margin-bottom:10px}
.fl{display:block;font-family:var(--fc);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#666;margin-bottom:5px}
.fi{width:100%;background:#222;border:1.5px solid #333;border-radius:8px;padding:12px 13px;font-family:var(--fb);font-size:15px;color:#fff;outline:none}
.fi:focus{border-color:var(--lime-dark)}
.fse{width:100%;background:#222;border:1.5px solid #333;border-radius:8px;padding:12px 13px;font-family:var(--fc);font-size:15px;font-weight:700;color:#fff;outline:none}
.plate-inp{font-family:var(--fc);font-size:32px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;text-align:center}
.btn{width:100%;background:var(--lime);color:var(--blk);border:none;border-radius:10px;padding:14px;font-family:var(--fc);font-size:17px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.btn.red{background:var(--red);color:#fff}
.btn.outline{background:transparent;border:1.5px solid #333;color:#fff}
.btn:disabled{opacity:.5}
.status-ok{background:#0a2e0a;border:2px solid #2e7d32;border-radius:10px;padding:14px;margin-bottom:12px}
.status-warn{background:#2e1a00;border:2px solid var(--gold);border-radius:10px;padding:14px;margin-bottom:12px}
.status-bad{background:#2e0000;border:2px solid var(--red);border-radius:10px;padding:14px;margin-bottom:12px}
.status-title{font-family:var(--fc);font-size:18px;font-weight:900;text-transform:uppercase;margin-bottom:4px}
.status-detail{font-size:13px;color:#aaa;line-height:1.6}
.vtype{background:#222;border:1.5px solid #333;border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.vtype.selected{border-color:var(--red);background:#2e0000}
.vtype-name{font-family:var(--fc);font-size:15px;font-weight:800}
.vtype-fine{font-family:var(--fc);font-size:15px;font-weight:900;color:var(--red)}
.hist-row{padding:10px 0;border-bottom:1px solid #222;font-size:13px}
.hist-row:last-child{border-bottom:none}
.sp{display:inline-block;font-family:var(--fc);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px}
.sp.active{background:#0a2e0a;color:#4caf50}
.sp.expired{background:#222;color:#666}
.sp.unpaid{background:#2e1a00;color:var(--gold)}
.sp.paid{background:#0a2e0a;color:#4caf50}
.photo-upload{background:#222;border:2px dashed #333;border-radius:10px;padding:20px;text-align:center;cursor:pointer;margin-bottom:12px}
.photo-preview{width:120px;height:120px;object-fit:cover;border-radius:8px;margin-bottom:12px;display:none}
@media print{
  .hd,#screen-lot,#screen-lookup,#screen-violation,#issued-summary,.btn{display:none!important}
  body,#screen-issued,#print-ticket{display:block!important;background:#fff!important}
  #print-ticket *{color:#000!important}
  @page{margin:0;size:3in auto}
}
.a2hs{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--blk);border-top:3px solid var(--lime);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -4px 16px rgba(0,0,0,.25);animation:a2hsUp .25s ease}
@keyframes a2hsUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.a2hs .a2hs-ic{width:40px;height:40px;border-radius:9px;flex-shrink:0}
.a2hs .a2hs-tx{flex:1;min-width:0}
.a2hs .a2hs-tt{font-family:var(--fc);font-weight:800;font-size:14px;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.a2hs .a2hs-sb{font-size:12px;color:#aaa;margin-top:2px;line-height:1.4}
.a2hs .a2hs-btn{background:var(--lime);color:var(--blk);border:none;border-radius:8px;padding:9px 16px;font-family:var(--fc);font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0}
.a2hs .a2hs-x{background:none;border:none;color:#888;font-size:20px;line-height:1;padding:4px 2px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div class="hd">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/"><img src="https://sldahhdbvcxdlqdhmsjd.supabase.co/storage/v1/object/public/assets/Logo%201.png" alt="City Park Management" style="height:38px;display:block"></a>
    <span style="font-family:var(--fc);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)">Enforcement</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="lot-badge" class="badge" style="display:none">No Lot Selected</div>
    <div id="user-badge" style="display:none;font-family:var(--fc);font-size:11px;font-weight:700;color:#888"></div>
    <button id="signout-btn" onclick="enfSignOut()" style="display:none;background:transparent;border:1px solid #333;border-radius:6px;padding:4px 10px;font-family:var(--fc);font-size:11px;font-weight:700;color:#666;cursor:pointer">Sign Out</button>
  </div>
</div>

<div class="wrap" id="main">
  <!-- Lot selection screen -->
  <div id="screen-lot">
    <div style="text-align:center;padding:40px 0 24px">
      <div style="font-family:var(--fc);font-size:24px;font-weight:900;text-transform:uppercase;margin-bottom:4px">Enforcement App</div>
      <div style="font-size:13px;color:#666">Select your assigned lot to begin</div>
    </div>
    <div class="card">
      <label class="fl">Select Lot</label>
      <select class="fse" id="lot-select" onchange="selectLot(this.value)">
        <option value="">— Choose a lot —</option>
      </select>
    </div>
    <div style="text-align:center;margin-top:8px">
      <a href="/" style="font-size:12px;color:#444">← Back to portal</a>
    </div>
  </div>

  <!-- Lookup screen -->
  <div id="screen-lookup" style="display:none">
    <div class="card">
      <div class="card-title"><i class="ti ti-search"></i> Plate Lookup</div>
      <label class="fl">License Plate</label>
      <input class="fi plate-inp" id="plate-input" placeholder="ABC 1234" maxlength="10" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')lookupPlate()">
      <button class="btn" onclick="lookupPlate()" style="margin-top:10px"><i class="ti ti-search"></i> Look Up</button>
    </div>
    <div id="lookup-result"></div>
  </div>

  <!-- Issue violation screen -->
  <div id="screen-violation" style="display:none">
    <div class="card">
      <div class="card-title"><i class="ti ti-alert-triangle"></i> Issue Violation</div>
      <div id="violation-plate-display" style="font-family:var(--fc);font-size:28px;font-weight:900;letter-spacing:.15em;color:var(--red);margin-bottom:14px;text-align:center"></div>
      <label class="fl">Violation Type</label>
      <div id="vtype-list"></div>
      <label class="fl" style="margin-top:12px">Notes (optional)</label>
      <textarea class="fi" id="violation-notes" rows="3" placeholder="Additional details..." style="resize:none"></textarea>
      <label class="fl" style="margin-top:12px">Photo Evidence</label>
      <div class="photo-upload" onclick="document.getElementById('photo-input').click()">
        <i class="ti ti-camera" style="font-size:28px;color:#444;display:block;margin-bottom:6px"></i>
        <div style="font-size:13px;color:#666">Tap to add photos (multiple allowed)</div>
      </div>
      <input type="file" id="photo-input" accept="image/*" capture="environment" multiple style="display:none" onchange="previewPhoto(this)">
      <div id="photo-preview-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
      <button class="btn red" id="issue-btn" onclick="issueViolation()" disabled><i class="ti ti-file-invoice"></i> Issue Violation</button>
      <button class="btn outline" onclick="showScreen('lookup')" style="margin-top:8px">Cancel</button>
    </div>
  </div>

  <!-- Issue warning screen -->
  <div id="screen-warning" style="display:none">
    <div class="card">
      <div class="card-title"><i class="ti ti-flag"></i> Issue Warning</div>
      <div id="warning-plate-display" style="font-family:var(--fc);font-size:28px;font-weight:900;letter-spacing:.15em;color:var(--gold);margin-bottom:14px;text-align:center"></div>
      <label class="fl">Reason</label>
      <input class="fi" id="warning-reason" placeholder="e.g. Slightly over the line, expired by a few minutes...">
      <label class="fl" style="margin-top:12px">Notes (optional)</label>
      <textarea class="fi" id="warning-notes" rows="3" placeholder="Additional details..." style="resize:none"></textarea>
      <label class="fl" style="margin-top:12px">Photo Evidence</label>
      <div class="photo-upload" onclick="document.getElementById('warning-photo-input').click()">
        <i class="ti ti-camera" style="font-size:28px;color:#444;display:block;margin-bottom:6px"></i>
        <div style="font-size:13px;color:#666">Tap to add photos (multiple allowed)</div>
      </div>
      <input type="file" id="warning-photo-input" accept="image/*" capture="environment" multiple style="display:none" onchange="previewWarningPhoto(this)">
      <div id="warning-photo-preview-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px"></div>
      <button class="btn" id="warning-btn" onclick="issueWarning()" style="background:var(--gold);color:#000"><i class="ti ti-flag"></i> Issue Warning</button>
      <button class="btn outline" onclick="showScreen('lookup')" style="margin-top:8px">Cancel</button>
    </div>
  </div>

  <!-- Violation issued screen -->
  <div id="screen-issued" style="display:none">
    <div style="text-align:center;padding:12px 0">
      <div id="issued-summary" style="font-size:13px;color:#888;margin-bottom:16px;line-height:1.7"></div>
    </div>
    <div id="print-ticket" style="background:#fff;border-radius:8px;margin-bottom:12px"></div>
    <button class="btn" onclick="window.print()" style="background:#2563eb;margin-bottom:8px"><i class="ti ti-printer"></i> Print Ticket</button>
    <button class="btn" onclick="newLookup()">Look Up Another Plate</button>
  </div>
</div>
<div id="a2hs-banner" class="a2hs" style="display:none"></div>

<script>
const SUPA_URL='https://sldahhdbvcxdlqdhmsjd.supabase.co';
const SUPA_KEY='sb_publishable_ZGELlV5vw7QFvva8_8NGcA_pQplXd46';

let _a2hsDeferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_a2hsDeferred=e;updateA2HSBanner();});
window.addEventListener('appinstalled',()=>{_a2hsDeferred=null;localStorage.setItem('cpm_a2hs_enforce_dismissed','1');updateA2HSBanner();});
function isA2HSStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function isA2HSiOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent);}
function isA2HSMobile(){return /Android|iPhone|iPad|iPod/.test(navigator.userAgent);}
function dismissA2HS(){localStorage.setItem('cpm_a2hs_enforce_dismissed','1');updateA2HSBanner();}
async function triggerA2HSInstall(){
  if(!_a2hsDeferred)return;
  _a2hsDeferred.prompt();
  const{outcome}=await _a2hsDeferred.userChoice;
  if(outcome==='accepted')localStorage.setItem('cpm_a2hs_enforce_dismissed','1');
  _a2hsDeferred=null;
  updateA2HSBanner();
}
function updateA2HSBanner(){
  const el=document.getElementById('a2hs-banner');
  if(!el)return;
  const show=isA2HSMobile()&&!isA2HSStandalone()&&!localStorage.getItem('cpm_a2hs_enforce_dismissed');
  if(!show){el.style.display='none';el.innerHTML='';return;}
  el.style.display='flex';
  el.innerHTML=_a2hsDeferred?
    `<img class="a2hs-ic" src="favicon_io/enforce-icon-192.png" alt=""><div class="a2hs-tx"><div class="a2hs-tt">Add CP Enforcement to your home screen</div><div class="a2hs-sb">Get to plate lookup faster next time — one tap, no need to open a browser.</div></div><button class="a2hs-btn" onclick="triggerA2HSInstall()">Install</button><button class="a2hs-x" onclick="dismissA2HS()" aria-label="Dismiss">&times;</button>`:
    isA2HSiOS()?
    `<img class="a2hs-ic" src="favicon_io/enforce-icon-192.png" alt=""><div class="a2hs-tx"><div class="a2hs-tt">Add CP Enforcement to your home screen</div><div class="a2hs-sb">Tap <i class="ti ti-share-2" style="font-size:12px"></i> Share, then "Add to Home Screen"</div></div><button class="a2hs-x" onclick="dismissA2HS()" aria-label="Dismiss">&times;</button>`:
    `<img class="a2hs-ic" src="favicon_io/enforce-icon-192.png" alt=""><div class="a2hs-tx"><div class="a2hs-tt">Add CP Enforcement to your home screen</div><div class="a2hs-sb">Tap <i class="ti ti-dots-vertical" style="font-size:12px"></i> the menu, then "Add to Home Screen" or "Install app"</div></div><button class="a2hs-x" onclick="dismissA2HS()" aria-label="Dismiss">&times;</button>`;
}
let currentLot=null;
let currentPlate='';
let selectedViolationType=null;
let violationTypes=[];
let photoFiles=[];
let warningPhotoFiles=[];

async function issueWarning(){
  const reason=document.getElementById('warning-reason')?.value.trim();
  const notes=document.getElementById('warning-notes')?.value.trim();
  const btn=document.getElementById('warning-btn');
  if(btn){btn.textContent='Issuing...';btn.disabled=true;}

  const photoUrls=[];
  if(warningPhotoFiles.length){
    const authToken=localStorage.getItem('enforce_token')||SUPA_KEY;
    for(let i=0;i<warningPhotoFiles.length;i++){
      const file=warningPhotoFiles[i];
      const fileName=`${Date.now()}_${i}_${currentPlate}.jpg`;
      const uploadRes=await fetch(`${SUPA_URL}/storage/v1/object/violation-photos/${fileName}`,{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+authToken,'Content-Type':file.type},
        body:file
      });
      if(uploadRes.ok){
        photoUrls.push(fileName);
      }
    }
  }

  const warningId='WARN-'+Date.now();
  await db('warnings','POST',{
    id:warningId,
    plate:currentPlate,
    lot_id:currentLot.id,
    lot_name:currentLot.name,
    reason:reason||null,
    notes:notes||null,
    photo_urls:photoUrls,
    issued_by:localStorage.getItem('enforce_officer')||'Staff'
  });

  const issuedAt=new Date();
  document.getElementById('issued-summary').innerHTML=`
    Plate: <strong>${currentPlate}</strong><br>
    Warning issued${reason?`: <strong>${reason}</strong>`:''}<br>
    Lot: <strong>${currentLot.name}</strong>
  `;

  // Build print ticket
  document.getElementById('print-ticket').innerHTML=`
    <div style="width:1.89in;font-family:monospace;font-size:9px;color:#000;background:#fff;padding:1.5mm;margin:0 auto;border:1px solid #000;box-sizing:border-box">
      <div style="text-align:center;margin-bottom:4mm">
        <div style="font-size:14px;font-weight:900;letter-spacing:1px">PARKING WARNING NOTICE</div>
        <div style="border-top:2px solid #000;margin:2mm 0"></div>
      </div>
      <div style="margin-bottom:3mm">
        <div style="font-size:10px;color:#666">WARNING ID</div>
        <div style="font-size:13px;font-weight:900">${warningId}</div>
      </div>
      <div style="margin-bottom:3mm">
        <div style="font-size:10px;color:#666">DATE & TIME</div>
        <div style="font-size:13px;font-weight:900">${issuedAt.toLocaleDateString()} ${issuedAt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <div style="margin-bottom:3mm">
        <div style="font-size:10px;color:#666">LICENSE PLATE</div>
        <div style="font-size:16px;font-weight:900;letter-spacing:1px">${currentPlate}</div>
      </div>
      <div style="margin-bottom:3mm">
        <div style="font-size:10px;color:#666">LOCATION</div>
        <div style="font-size:13px;font-weight:900">${currentLot.name}</div>
      </div>
      ${reason?`<div style="margin-bottom:3mm">
        <div style="font-size:10px;color:#666">REASON</div>
        <div style="font-size:13px;font-weight:900">${reason}</div>
      </div>`:''}
      <div style="border-top:2px solid #000;border-bottom:2px solid #000;padding:2mm 0;margin:3mm 0;text-align:center">
        <div style="font-size:12px;font-weight:900">NO FEE — THIS IS A WARNING ONLY</div>
      </div>
      <div style="text-align:center;font-size:9px;color:#666;margin-top:3mm;border-top:1px dashed #999;padding-top:2mm">
        City Park Management<br>
        Issued by: ${localStorage.getItem('enforce_officer')||'Staff'}
      </div>
      <div style="text-align:center;font-size:9px;font-weight:700;line-height:1.5;margin-top:3mm;border-top:1px dashed #999;padding-top:2mm">FUTURE VIOLATIONS OF THIS TYPE MAY RESULT IN A FINE.</div>
    </div>
  `;

  if(btn){btn.textContent='Issue Warning';btn.disabled=false;}
  showScreen('issued');
}

async function db(table,method,body,query=''){
  const token=localStorage.getItem('enforce_token')||SUPA_KEY;
  const res=await fetch(`${SUPA_URL}/rest/v1/${table}${query}`,{
    method,
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Prefer':'return=representation'},
    body:body?JSON.stringify(body):undefined
  });
  if(!res.ok)return null;
  return res.json();
}

let currentUser=null;
let _pwResetMode=false;

async function init(){
  const hashParams=new URLSearchParams(window.location.hash.replace('#',''));
  if(hashParams.get('type')==='recovery'&&hashParams.get('access_token')){
    history.replaceState(null,'',window.location.pathname);
    showResetPasswordScreen(hashParams.get('access_token'));
    return;
  }
  // Check for existing session
  const token=localStorage.getItem('enforce_token');
  if(token){
    const profile=await verifyToken(token);
    if(profile){
      currentUser=profile;
      initApp();
      return;
    }
  }
  showLoginScreen();
}

async function sendEnfPasswordReset(){
  const email=document.getElementById('reset-email')?.value.trim();
  const errEl=document.getElementById('reset-err');
  if(!email||!email.includes('@')){if(errEl)errEl.textContent='Please enter a valid email address.';return;}
  const btn=document.querySelector('.btn');
  if(btn){btn.textContent='Sending...';btn.disabled=true;}
  const redirectUrl=encodeURIComponent(window.location.origin+'/enforce');
  await fetch(`${SUPA_URL}/auth/v1/recover?redirect_to=${redirectUrl}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
    body:JSON.stringify({email})
  });
  const msgEl=document.getElementById('reset-msg');
  if(msgEl){msgEl.style.display='block';msgEl.textContent='If an account exists for that email, a reset link has been sent. Check your inbox.';}
  if(btn){btn.textContent='Send Reset Link';btn.disabled=false;}
}

function showResetPasswordScreen(recoveryToken){
  document.getElementById('main').innerHTML=`
    <div style="text-align:center;padding:40px 0 24px">
      <div style="font-family:var(--fc);font-size:24px;font-weight:900;text-transform:uppercase;margin-bottom:4px">Set New Password</div>
      <div style="font-size:13px;color:#666;margin-bottom:24px">Choose a new password for your account</div>
    </div>
    <div class="card">
      <label class="fl">New Password</label>
      <input class="fi" id="newpw" type="password" placeholder="At least 6 characters" autocomplete="new-password">
      <label class="fl" style="margin-top:12px">Confirm Password</label>
      <input class="fi" id="newpw2" type="password" placeholder="Re-enter password" autocomplete="new-password" style="margin-bottom:12px">
      <div id="reset-err" style="color:var(--red);font-size:12px;margin-bottom:8px;min-height:16px"></div>
      <button class="btn" onclick="confirmEnfPasswordReset('${recoveryToken}')">Set Password &amp; Sign In</button>
    </div>
  `;
}

async function confirmEnfPasswordReset(recoveryToken){
  const pw1=document.getElementById('newpw')?.value||'';
  const pw2=document.getElementById('newpw2')?.value||'';
  const errEl=document.getElementById('reset-err');
  if(pw1.length<6){if(errEl)errEl.textContent='Password must be at least 6 characters.';return;}
  if(pw1!==pw2){if(errEl)errEl.textContent='Passwords do not match.';return;}
  const btn=document.querySelector('.btn');
  if(btn){btn.textContent='Saving...';btn.disabled=true;}
  const res=await fetch(`${SUPA_URL}/auth/v1/user`,{
    method:'PUT',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+recoveryToken},
    body:JSON.stringify({password:pw1})
  });
  if(!res.ok){
    if(errEl)errEl.textContent='Something went wrong. Please request a new reset link.';
    if(btn){btn.textContent='Set Password & Sign In';btn.disabled=false;}
    return;
  }
  const profile=await verifyToken(recoveryToken);
  if(profile){
    currentUser=profile;
    localStorage.setItem('enforce_token',recoveryToken);
    initApp();
  } else {
    _pwResetMode=false;
    showLoginScreen();
  }
}

async function verifyToken(token){
  const res=await fetch(`${SUPA_URL}/auth/v1/user`,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}
  });
  if(!res.ok)return null;
  const user=await res.json();
  const profRes=await fetch(`${SUPA_URL}/rest/v1/profiles?id=eq.${user.id}&select=*`,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token}
  });
  if(!profRes.ok)return null;
  const profiles=await profRes.json();
  if(!profiles||!profiles.length)return null;
  const profile=profiles[0];
  if(!profile.active)return null;
  localStorage.setItem('enforce_token',token);
  return profile;
}

async function enfLogin(){
  const email=document.getElementById('enf-email')?.value.trim();
  const password=document.getElementById('enf-pass')?.value;
  const btn=document.querySelector('.btn');
  if(btn){btn.textContent='Signing in...';btn.disabled=true;}

  const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
    body:JSON.stringify({email,password})
  });

  if(!res.ok){
    const err=document.getElementById('enf-err');
    if(err)err.textContent='Invalid email or password.';
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    return;
  }

  const data=await res.json();
  const profile=await verifyToken(data.access_token);

  if(!profile){
    const err=document.getElementById('enf-err');
    if(err)err.textContent='Account not authorized for enforcement.';
    if(btn){btn.textContent='Sign In';btn.disabled=false;}
    return;
  }

  currentUser=profile;
  localStorage.setItem('enforce_token',data.access_token);
  localStorage.removeItem('enforce_lot');
  initApp();
}

async function lookupPlate(){
  const plate=document.getElementById('plate-input').value.trim().toUpperCase();
  if(!plate)return;
  currentPlate=plate;
  const result=document.getElementById('lookup-result');
  result.innerHTML=`<div style="text-align:center;padding:20px;color:#666">Searching...</div>`;

  // Check active sessions
  const sessions=await db('sessions','GET',null,`?plate=eq.${encodeURIComponent(plate)}&lot_id=eq.${currentLot.id}&select=*&order=start_time.desc&limit=10`);
  const lotData=await db('lots','GET',null,`?id=eq.${currentLot.id}&select=*`);
  const passes=await db('passes','GET',null,`?plate=eq.${encodeURIComponent(plate)}&lot_id=eq.${currentLot.id}&status=in.(active,past_due)&select=*`);
  const now=Date.now();
  const activeSess=(sessions||[]).filter(s=>new Date(s.start_time).getTime()+s.duration*3600000>now);


  // Check violation history
  const violations=await db('violations','GET',null,`?plate=eq.${encodeURIComponent(plate)}&order=created_at.desc&limit=5`);

  // Check warning history
  const warnings=await db('warnings','GET',null,`?plate=eq.${encodeURIComponent(plate)}&order=created_at.desc&limit=5`);

  let html='';

  // Status
  if(activeSess.length>0){
    const s=activeSess[0];
    const exp=new Date(new Date(s.start_time).getTime()+s.duration*3600000);
    html+=`<div class="status-ok"><div class="status-title">✅ Valid Session</div><div class="status-detail">Expires ${exp.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · ${s.type} · Paid $${s.paid.toFixed(2)}</div></div>`;
  } else if(passes&&passes.length>0){
    const p=passes[0];
    const lotInfo=await db('lots','GET',null,`?id=eq.${currentLot.id}&select=*`);
  const lot=lotInfo?.[0];
    const restrictions=lot?.pass_restrictions||{type:'none'};

    if(p.status==='past_due'){
      const failedAt=p.past_due_since?new Date(p.past_due_since):null;
      const graceEnds=failedAt?new Date(failedAt.getTime()+48*3600000):null;
      const inGrace=graceEnds&&Date.now()<graceEnds.getTime();
      if(inGrace){
        const hoursLeft=Math.max(0,Math.ceil((graceEnds.getTime()-Date.now())/3600000));
        html+=`<div class="status-warn"><div class="status-title">⚠️ Payment Failed</div><div class="status-detail">${p.holder_name||p.name}'s monthly pass payment failed. Grace period ends in ${hoursLeft} hour${hoursLeft===1?'':'s'}.</div></div>`;
      } else {
        html+=`<div class="status-bad"><div class="status-title">❌ Pass Expired — Payment Failed</div><div class="status-detail">${p.holder_name||p.name}'s payment failed and the grace period has ended. Pass is no longer valid.</div></div>`;
        html+=`<button class="btn red" onclick="startViolation('${plate}')"><i class="ti ti-alert-triangle"></i> Issue Violation</button><button class="btn outline" onclick="startWarning('${plate}')" style="margin-top:8px"><i class="ti ti-flag"></i> Issue Warning</button>`;
      }
    } else {
      const isValidNow=p.override_restrictions||checkPassRestrictions(restrictions);
      if(isValidNow){
        html+=`<div class="status-ok"><div class="status-title">✅ Monthly Pass</div><div class="status-detail">${p.holder_name||p.name} · Valid through ${new Date(p.next_bill_date).toLocaleDateString()}${restrictions.type!=='none'?'<br><span style="font-size:11px;color:#4caf50">✓ Within allowed hours/days</span>':''}</div></div>`;
      } else {
        html+=`<div class="status-warn"><div class="status-title">⚠️ Pass Restricted</div><div class="status-detail">${p.holder_name||p.name} has a monthly pass but it is not valid at this time.<br>${getRestrictionText(restrictions)}</div></div>`;
        html+=`<button class="btn red" onclick="startViolation('${plate}')"><i class="ti ti-alert-triangle"></i> Issue Violation</button><button class="btn outline" onclick="startWarning('${plate}')" style="margin-top:8px"><i class="ti ti-flag"></i> Issue Warning</button>`;
      }
    }
  } else {
    const lastSess=(sessions||[])[0];
    let expiredNote='';
    if(lastSess){
      const exp=new Date(new Date(lastSess.start_time).getTime()+lastSess.duration*3600000);
      expiredNote=`<br>Last session expired ${exp.toLocaleDateString()} at ${exp.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    }
    html+=`<div class="status-bad"><div class="status-title">❌ No Valid Parking</div><div class="status-detail">No active session or monthly pass found for this plate at ${currentLot.name}${expiredNote}</div></div>`;
    html+=`<button class="btn red" onclick="startViolation('${plate}')"><i class="ti ti-alert-triangle"></i> Issue Violation</button><button class="btn outline" onclick="startWarning('${plate}')" style="margin-top:8px"><i class="ti ti-flag"></i> Issue Warning</button>`;
  }

  // Recent sessions
  if(sessions&&sessions.length>0){
    html+=`<div class="card" style="margin-top:14px"><div class="card-title"><i class="ti ti-history"></i> Recent Sessions</div>`;
    sessions.slice(0,5).forEach(s=>{
      const exp=new Date(new Date(s.start_time).getTime()+s.duration*3600000);
      const isActive=exp.getTime()>now;
      const minsSinceExpired=Math.floor((now-exp.getTime())/60000);
      const recentlyExpired=!isActive&&minsSinceExpired<=60;
      const status=isActive?'Active':recentlyExpired?`Expired ${minsSinceExpired}m ago`:'Expired';
      const statusClass=isActive?'active':recentlyExpired?'expiring':'expired';
      html+=`<div class="hist-row"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--fc);font-size:14px;font-weight:800">${s.type}</span><span class="sp ${statusClass}">${status}</span></div><div style="color:#666;margin-top:2px">${new Date(s.start_time).toLocaleDateString()} · $${s.paid.toFixed(2)}</div></div>`;
    });
    html+=`</div>`;
  }

  // Violation history
  if(violations&&violations.length>0){
    html+=`<div class="card" style="margin-top:14px"><div class="card-title" style="color:var(--red)"><i class="ti ti-alert-triangle"></i> Violation History</div>`;
    violations.forEach(v=>{
      html+=`<div class="hist-row"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--fc);font-size:14px;font-weight:800">${v.violation_name}</span><span class="sp ${v.status==='paid'?'paid':'unpaid'}">${v.status}</span></div><div style="color:#666;margin-top:2px">${new Date(v.created_at).toLocaleDateString()} · $${v.fine_amount.toFixed(2)} · ${v.lot_name||'—'}</div><button class="btn outline" style="margin-top:6px;padding:8px;font-size:12px" onclick='reprintViolation(${JSON.stringify(v).replace(/'/g,"&#39;")})'><i class="ti ti-printer"></i> Reprint</button></div>`;
    });
    html+=`</div>`;
  }

  // Warning history
  if(warnings&&warnings.length>0){
    html+=`<div class="card" style="margin-top:14px"><div class="card-title" style="color:var(--gold)"><i class="ti ti-flag"></i> Warning History</div>`;
    warnings.forEach(w=>{
      html+=`<div class="hist-row"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-family:var(--fc);font-size:14px;font-weight:800">${w.reason||'Warning'}</span></div><div style="color:#666;margin-top:2px">${new Date(w.created_at).toLocaleDateString()} · ${w.lot_name||'—'}</div></div>`;
    });
    html+=`</div>`;
  }

  result.innerHTML=html;
}

        <input type="radio" name="parking-fee" id="pf-none" value="0" style="width:18px;height:18px;cursor:pointer">

          <div style="font-family:var(--fc);font-size:14px;font-weight:800;color:#fff">No Fee</div>
          <div style="font-size:12px;color:var(--gold);font-weight:700">+$0.00</div>

function selectVType(id){
  document.querySelectorAll('.vtype').forEach(el=>el.classList.remove('selected'));
  document.getElementById('vt-'+id)?.classList.add('selected');
  selectedViolationType=violationTypes.find(v=>v.id===id);
  document.getElementById('issue-btn').disabled=false;
}

function previewPhoto(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  files.forEach(file=>photoFiles.push(file));
  input.value='';
  renderPhotoPreviews();
}

function previewWarningPhoto(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  files.forEach(file=>warningPhotoFiles.push(file));
  input.value='';
  renderWarningPhotoPreviews();
}

function renderWarningPhotoPreviews(){
  const list=document.getElementById('warning-photo-preview-list');
  if(!list)return;
  list.innerHTML='';
  warningPhotoFiles.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:relative;width:80px;height:80px';
      wrap.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"><button onclick="removeWarningPhoto(${i})" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;cursor:pointer;line-height:1">×</button>`;
      list.appendChild(wrap);
    };
    reader.readAsDataURL(file);
  });
}

function removeWarningPhoto(index){
  warningPhotoFiles.splice(index,1);
  renderWarningPhotoPreviews();
}

function renderPhotoPreviews(){
  const list=document.getElementById('photo-preview-list');
  if(!list)return;
  list.innerHTML='';
  photoFiles.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:relative;width:80px;height:80px';
      wrap.innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:8px"><button onclick="removePhoto(${i})" style="position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;cursor:pointer;line-height:1">×</button>`;
      list.appendChild(wrap);
    };
    reader.readAsDataURL(file);
  });
}

function removePhoto(index){
  photoFiles.splice(index,1);
  renderPhotoPreviews();
}

async function issueViolation(){
  if(!selectedViolationType)return;
  const btn=document.getElementById('issue-btn');
  btn.textContent='Issuing...';btn.disabled=true;

  let photoUrl=null;
  let photoUrls=[];

  // Upload all photos if provided
  if(photoFiles.length){
    const authToken=localStorage.getItem('enforce_token')||SUPA_KEY;
    for(let i=0;i<photoFiles.length;i++){
      const file=photoFiles[i];
      const fileName=`${Date.now()}_${i}_${currentPlate}.jpg`;
      const uploadRes=await fetch(`${SUPA_URL}/storage/v1/object/violation-photos/${fileName}`,{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+authToken,'Content-Type':file.type},
        body:file
      });
      if(uploadRes.ok){
        photoUrls.push(fileName);
      }
    }
    photoUrl=photoUrls[0]||null;
  }

  
  const violationId='VIO-'+Date.now().toString().slice(-10);
  const notes=document.getElementById('violation-notes').value.trim();
  const selectedPF=document.querySelector('input[name="parking-fee"]:checked');
  const parkingFee=selectedPF?parseFloat(selectedPF.value)||0:0;
  const totalFine=selectedViolationType.fine_amount+parkingFee;

  // Save violation
  await db('violations','POST',{
    id:violationId,
    plate:currentPlate,
    lot_id:currentLot.id,
    lot_name:currentLot.name,
    violation_type_id:selectedViolationType.id,
    violation_name:selectedViolationType.name,
    fine_amount:totalFine,
    parking_fee:parkingFee,
    notes:notes||null,
    photo_url:photoUrl,
    photo_urls:photoUrls,
    issued_by:localStorage.getItem('enforce_officer')||'Staff',
    status:'unpaid'
  });

  const issuedAt=new Date();
  printViolationTicket({
    id:violationId,plate:currentPlate,lot_name:currentLot.name,
    violation_name:selectedViolationType.name,fine_amount:selectedViolationType.fine_amount,
    parking_fee:parkingFee,created_at:issuedAt.toISOString(),issued_by:localStorage.getItem('enforce_officer')||'Staff'
  });
  return;
}

function reprintViolation(v){
  showScreen('issued');
  printViolationTicket(v);
}

function checkPassRestrictions(r){
  if(!r||r.type==='none')return true;
  const now=new Date();
  const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][now.getDay()];
  const hour=now.getHours();
  const minute=now.getMinutes();
  const timeVal=hour*60+minute;

  if(r.type==='weekdays')return['Mon','Tue','Wed','Thu','Fri'].includes(day);
  if(r.type==='weekends')return['Sat','Sun'].includes(day);
  if(r.type==='days')return(r.days||[]).includes(day);
  if(r.type==='hours'){
    const [sh,sm]=r.start_time.split(':').map(Number);
    const [eh,em]=r.end_time.split(':').map(Number);
    return timeVal>=(sh*60+sm)&&timeVal<=(eh*60+em);
  }
  if(r.type==='both'){
    const dayOk=(r.days||[]).includes(day);
    const [sh,sm]=r.start_time.split(':').map(Number);
    const [eh,em]=r.end_time.split(':').map(Number);
    const timeOk=timeVal>=(sh*60+sm)&&timeVal<=(eh*60+em);
    return dayOk&&timeOk;
  }
  return true;
}

function getRestrictionText(r){
  if(r.type==='weekdays')return'Pass is valid Monday-Friday only.';
  if(r.type==='weekends')return'Pass is valid Saturday-Sunday only.';
  if(r.type==='days')return`Pass is valid on: ${(r.days||[]).join(', ')} only.`;
  if(r.type==='hours')return`Pass is valid ${r.start_time} - ${r.end_time} only.`;
  if(r.type==='both')return`Pass is valid ${(r.days||[]).join(', ')} from ${r.start_time} - ${r.end_time} only.`;
  return'';
}
